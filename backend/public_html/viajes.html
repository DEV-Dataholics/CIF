<!DOCTYPE html>
<html class="dark" lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>CIF Logística — Centro de Control de Viajes</title>
  <link href="assets/css/tailwind.min.css?v=2" rel="stylesheet">
  <script defer src="https://unpkg.com/alpinejs@3.14.1/dist/cdn.min.js"></script>
  <link href="https://fonts.googleapis.com/css2?family=Noto+Serif:wght@400;700&family=Manrope:wght@400;500;600;700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <script src="https://unpkg.com/@phosphor-icons/web"></script>
  
  <style>
    body { min-height: 100dvh; }
    
    .matte-grain { position: relative; }
    .matte-grain::before {
      content: ""; position: absolute; inset: 0; opacity: 0.03; pointer-events: none;
      background-image: url(https://lh3.googleusercontent.com/aida-public/AB6AXuCxtzo5Fd4tGwvT_jg4ysGETAyo_0QJXqFxE0Vz2jCSFfdCW_xcsx8ttX4CZRiXAQ5e-8ClJGovIme_H86utYa8siODIK5ToDWQRd0J97DLwVKIRNDWTJFuuP9hcZHxl3TW0UHrsINdFeEP-GfWzg6ZsUAe9dbaTn0kGfYEn6L_suxq7ifFL2e4HJJxC6M6yMa4wOfyyyiBZMm_ILej9DcNsEEVsRhY2idiHrWisdeOIG82K0lswo1JUKVmQYcwAiapSH8q-Y8FZ4J8);
    }

    /* KPI Cards borders */
    .kpi-border-orange { border-top: 3px solid #f97316; }
    .kpi-border-yellow { border-top: 3px solid #eab308; }
    .kpi-border-green  { border-top: 3px solid #22c55e; }
    .kpi-border-blue   { border-top: 3px solid #3b82f6; }
    
    /* ── KANBAN ── */
    .kanban-board { display: flex; gap: 1rem; overflow-x: auto; padding-bottom: 1rem; height: calc(100vh - 300px); min-height: 480px; align-items: flex-start; scrollbar-width: thin; scrollbar-color: var(--cif-border) transparent; }
    .kanban-board::-webkit-scrollbar { height: 8px; }
    .kanban-board::-webkit-scrollbar-thumb { background-color: rgba(209,161,78,0.5); border-radius: 4px; }
    
    .kanban-col { background: rgba(27,27,28,0.8); border: 1px solid rgba(79,69,63,0.3); width: 330px; flex-shrink: 0; display: flex; flex-direction: column; max-height: 100%; border-top: 3px solid #64748b; }
    .kanban-col[data-status="solicitado"] { border-top-color: #64748b; }
    .kanban-col[data-status="asignado"] { border-top-color: #3b82f6; }
    .kanban-col[data-status="en_transito"] { border-top-color: #f97316; }
    .kanban-col[data-status="en_aduana"] { border-top-color: #eab308; }
    .kanban-col[data-status="entregado"] { border-top-color: #22c55e; }
    
    .kanban-header { padding: .75rem 1rem; display: flex; justify-content: space-between; align-items: center; border-bottom: 1px solid rgba(79,69,63,0.3); background: var(--cif-card); }
    .kanban-title { font-weight: 700; font-size: .85rem; text-transform: uppercase; letter-spacing: .05em; display:flex; align-items:center; gap:.5rem; }
    .kanban-body { padding: .75rem; overflow-y: auto; display: flex; flex-direction: column; gap: .75rem; }
    
    .k-card { background: #1f1f20; border: 1px solid rgba(79,69,63,0.3); padding: 1rem; cursor: pointer; transition: all .2s; }
    .k-card:hover { border-color: #D1A14E; box-shadow: 0 4px 12px rgba(209,161,78,.1); transform: translateY(-2px); }
    .k-card.k-urgent { border-left: 4px solid #ffb4ab; }
    
    .k-operator { display:flex; align-items:center; gap:.4rem; font-size:.8rem; background: rgba(255,255,255,.05); padding: .3rem .5rem; width:fit-content; }
    
    .k-time-ticker { display:inline-flex; align-items:center; gap:.25rem; font-family:'Manrope', monospace; font-weight:700; font-size:.75rem; background:rgba(255,255,255,.05); padding:.15rem .4rem; }
    .k-urgent .k-time-ticker { color: #ffb4ab; background: rgba(255,180,171,.1); }

    /* Tables Gold UI */
    .cif-table { width: 100%; border-collapse: collapse; }
    .cif-table th { text-align: left; padding: 1rem; border-bottom: 1px solid rgba(79,69,63,0.3); font-family: 'Inter', sans-serif; font-size: 0.65rem; text-transform: uppercase; letter-spacing: 0.1em; color: #9b8e87; }
    .cif-table td { padding: 1rem; border-bottom: 1px solid rgba(79,69,63,0.1); font-family: 'Manrope', sans-serif; }
    .cif-table tbody tr:hover { background: rgba(79,69,63,0.05); }
    
    /* ── DRAWER PANEL (Detalles) ── */
    .drawer-overlay { position: fixed; inset: 0; background: rgba(0,0,0,0.6); backdrop-filter: blur(3px); z-index: 100; transition: opacity .3s; }
    .drawer-panel { position: fixed; top: 0; right: 0; bottom: 0; width: 560px; max-width: 100vw; background: #131314; border-left: 1px solid rgba(79,69,63,0.3); box-shadow: -8px 0 32px rgba(0,0,0,0.4); display: flex; flex-direction: column; transform: translateX(100%); transition: transform .3s cubic-bezier(0.16, 1, 0.3, 1); z-index: 101; }
    .drawer-panel.open { transform: translateX(0); }
    
    /* Spinners */
    .spinner { display: inline-block; width: 16px; height: 16px; border: 2px solid rgba(209,161,78,0.3); border-top-color: #D1A14E; border-radius: 50%; animation: spin 0.6s linear infinite; }
    @keyframes spin { to { transform: rotate(360deg); } }

    /* Modal Contextual */
    .modal-box { position: fixed; top: 50%; left: 50%; transform: translate(-50%, -50%); background: #1b1b1c; border: 1px solid rgba(79,69,63,0.4); width: 100%; box-shadow: 0 25px 50px -12px rgba(0,0,0,0.5); z-index: 1001; padding: 2rem; max-width: 440px; }
  </style>
</head>
<body class="bg-surface text-on-surface font-body selection:bg-primary selection:text-on-primary">

<div x-data="viajesApp()" x-init="init()" class="min-h-screen flex flex-col" :class="{'overflow-hidden': showDrawer}">

  <!-- ═══════════════════════════════════════════════════ -->
  <!--  HEADER / TOP NAVIGATION                           -->
  <!-- ═══════════════════════════════════════════════════ -->
  <header class="bg-surface-container-lowest sticky top-0 z-50 border-b border-outline-variant/10">
    <div class="max-w-[1400px] mx-auto px-8 py-5 flex justify-between items-center">
      <!-- Brand -->
      <a href="home.html" class="flex items-center gap-3 hover:opacity-90 transition-opacity">
        <img src="assets/LOGOCIF.png" alt="CIF Logística" style="height:5.5rem;width:auto;object-fit:contain;filter:drop-shadow(0 0 8px rgba(209,161,78,0.2));">
      </a>

      <!-- Nav Links -->
      <nav class="hidden lg:flex gap-6 font-label text-[10px] uppercase tracking-widest font-bold">
        <a class="text-outline-variant hover:text-primary transition-colors" href="home.html">Inicio</a>
        <a class="text-outline-variant hover:text-primary transition-colors" href="dashboard.html">Dashboard</a>
        <a class="text-primary border-b border-primary pb-1 hidden" href="viajes.html">Viajes</a>
        <a class="text-outline-variant hover:text-primary transition-colors" href="flota.html">Flota</a>
        <a class="text-outline-variant hover:text-primary transition-colors" href="operadores.html">Operadores</a>
        <a class="text-outline-variant hover:text-primary transition-colors" href="taller.html">Taller</a>
        <a class="text-outline-variant hover:text-primary transition-colors" href="porteria.html">Accesos</a>
        <a class="text-outline-variant hover:text-primary transition-colors" href="cobranza.html">Cobranza</a>
        <!-- <a class="text-outline-variant hover:text-primary transition-colors" href="gamificacion.html">Metas</a> -->
      </nav>

      <!-- User -->
      <div class="flex items-center gap-4">
        <div class="text-right hidden sm:block">
          <div class="text-xs font-body text-on-surface" x-text="usuario?.nombre || 'Cargando...'"></div>
          <div class="text-[10px] font-label text-primary uppercase tracking-wider" x-text="usuario?.rol?.toUpperCase() || ''"></div>
        </div>
        <div class="w-10 h-10 bg-surface-container-highest border border-outline-variant/20 flex items-center justify-center">
          <i class="ph-light ph-user text-primary text-xl"></i>
        </div>
        <button @click="cifAPI.logout()" class="hidden sm:flex items-center gap-2 text-xs font-label uppercase tracking-wider text-outline hover:text-primary transition-colors border border-outline-variant/20 px-4 py-2">
          <i class="ph-light ph-sign-out text-lg"></i>
          Salir
        </button>
      </div>
    </div>
  </header>

  <main class="flex-1 w-full max-w-[1400px] mx-auto px-8 py-10 flex flex-col">

    <!-- Topbar info -->
    <div class="flex flex-col md:flex-row md:items-end justify-between mb-8 gap-6">
      <div>
        <span class="font-label text-primary text-[11px] uppercase tracking-[0.3em] mb-4 block">Módulo 02</span>
        <h2 class="font-headline text-4xl font-bold tracking-tight mb-3 flex items-center gap-3">
          <i class="ph-light ph-map-trifold text-primary"></i> Control de Viajes
        </h2>
        <div class="font-label text-xs uppercase tracking-widest text-outline">Operaciones en tiempo real de la flota</div>
      </div>
      <div class="flex items-center gap-4">
        <!-- Vista Toggle -->
        <div class="flex bg-surface-container-low border border-outline-variant/20 p-1">
          <button @click="vista = 'kanban'" :class="vista==='kanban' ? 'bg-surface-container-highest text-primary' : 'text-outline hover:text-white'" class="px-4 py-2 text-xs font-label font-bold uppercase tracking-widest transition-all"><i class="ph-light ph-kanban mr-1"></i> Kanban</button>
          <button @click="vista = 'tabla'" :class="vista==='tabla' ? 'bg-surface-container-highest text-primary' : 'text-outline hover:text-white'" class="px-4 py-2 text-xs font-label font-bold uppercase tracking-widest transition-all"><i class="ph-light ph-table mr-1"></i> Tabla</button>
        </div>
        <button @click="abrirNuevo()" class="bg-primary text-on-primary font-label text-xs font-bold uppercase tracking-widest px-6 py-3 hover:brightness-110 transition-all flex items-center gap-2" x-show="puedeCrear">
          <i class="ph-bold ph-plus"></i> Nuevo
        </button>
      </div>
    </div>

    <!-- KPIs en Vivo -->
    <div class="grid grid-cols-2 lg:grid-cols-4 gap-px bg-outline-variant/20 mb-8 shrink-0">
      <div class="bg-surface-container-low matte-grain p-6 kpi-border-orange">
        <div class="text-4xl font-body font-bold text-alert mb-2" x-text="kpis.en_ruta">0</div>
        <div class="text-[10px] font-label uppercase tracking-widest text-outline flex items-center gap-2"><i class="ph-fill ph-truck text-alert"></i> En Ruta</div>
      </div>
      <div class="bg-surface-container-low matte-grain p-6 kpi-border-yellow">
        <div class="text-4xl font-body font-bold text-warning mb-2" x-text="kpis.en_aduana">0</div>
        <div class="text-[10px] font-label uppercase tracking-widest text-outline flex items-center gap-2"><i class="ph-fill ph-building text-warning"></i> En Aduana</div>
      </div>
      <div class="bg-surface-container-low matte-grain p-6 kpi-border-green">
        <div class="text-4xl font-body font-bold text-success mb-2" x-text="kpis.entregados_hoy">0</div>
        <div class="text-[10px] font-label uppercase tracking-widest text-outline flex items-center gap-2"><i class="ph-fill ph-check-circle text-success"></i> Entregados (Hoy)</div>
      </div>
      <div class="bg-surface-container-low matte-grain p-6 kpi-border-blue">
        <div class="text-4xl font-body font-bold text-info mb-2" x-text="kpis.por_documentar">0</div>
        <div class="text-[10px] font-label uppercase tracking-widest text-outline flex items-center gap-2"><i class="ph-fill ph-file-text text-info"></i> Por Documentar</div>
      </div>
    </div>

    <div x-show="loading" class="flex-1 flex items-center justify-center py-16">
      <span class="spinner" style="width:36px;height:36px;"></span>
    </div>

    <!-- ── VISTA KANBAN ── -->
    <div x-show="!loading && vista === 'kanban'" class="kanban-board flex-1">
      <template x-for="col in kanbanCols" :key="col.key">
        <div class="kanban-col matte-grain" :data-status="col.key">
          <div class="kanban-header">
            <div class="kanban-title text-outline-variant">
              <i :class="col.icon" class="text-lg"></i> <span x-text="col.label"></span>
            </div>
            <span class="px-2 border border-outline-variant/30 text-[10px] text-outline font-mono opacity-80" x-text="col.items.length"></span>
          </div>
          <div class="kanban-body">
            <template x-if="col.items.length === 0">
              <div class="text-center text-xs p-4 text-outline font-label uppercase tracking-widest opacity-50">Sin viajes aquí</div>
            </template>
            <template x-for="v in col.items" :key="v.id">
              <div class="k-card" :class="{'k-urgent': esUrgente(v)}" @click="abrirDetalle(v)">
                <div class="flex justify-between items-start mb-2 font-label">
                  <span class="font-mono font-bold text-xs text-primary" x-text="'#' + String(v.id).padStart(4,'0')"></span>
                  <span class="text-[10px] font-bold uppercase tracking-widest text-outline-variant" x-text="v.tipo_movimiento.replace(/_/g,' ')"></span>
                </div>
                <div class="font-bold text-on-surface mb-2 leading-tight text-sm" x-text="v.destino"></div>
                <div class="text-xs text-outline mb-3 flex items-center gap-1.5"><i class="ph-fill ph-map-pin"></i> <span x-text="v.origen"></span></div>
                
                <div class="flex gap-2 mb-3">
                   <span class="k-operator text-outline"><i class="ph-light ph-user pr-1"></i> <span x-text="v.operador?.split(' ')[0] || 'S/A'"></span></span>
                   <span class="k-operator text-outline font-mono"><i class="ph-light ph-truck pr-1"></i> <span x-text="v.economico || 'S/A'"></span></span>
                </div>
                
                <div class="border-t border-outline-variant/10 mt-2 pt-2 flex justify-between items-center">
                  <div class="k-time-ticker text-outline"><i class="ph-light ph-clock pr-1"></i> <span x-text="tiempoEnEstatus(v)"></span></div>
                  <button class="border border-outline-variant/30 hover:border-primary text-outline hover:text-primary transition-colors p-1" @click.stop="abrirAvance(v)" title="Avanzar Estatus">
                    <i class="ph-bold ph-caret-right"></i>
                  </button>
                </div>
              </div>
            </template>
          </div>
        </div>
      </template>
    </div>

    <!-- ── VISTA TABLA ── -->
    <div x-show="!loading && vista === 'tabla'" class="bg-surface-container-low border border-outline-variant/20 matte-grain flex-1 overflow-auto">
      <div class="p-4 border-b border-outline-variant/20 flex gap-4 bg-surface-container-lowest sticky top-0 z-10">
        <div class="relative w-full max-w-sm">
          <i class="ph-light ph-magnifying-glass absolute left-3 top-1/2 -translate-y-1/2 text-outline"></i>
          <input x-model="busqueda" @input="filtrarTabla()" type="text" placeholder="Buscar folio, operador, ruta..." class="w-full bg-surface border border-outline-variant/30 pl-10 pr-4 py-2 text-sm text-on-surface focus:border-primary focus:outline-none transition-colors">
        </div>
      </div>
      <table class="cif-table">
        <thead class="sticky top-[57px] bg-surface-container-lowest z-10">
          <tr><th>Folio</th><th>Tipo / Ruta</th><th>Operador</th><th>Unidad</th><th>Estatus</th><th>Tiempo</th><th>Acciones</th></tr>
        </thead>
        <tbody>
          <template x-if="viajesTabla.length === 0">
            <tr><td colspan="7" class="text-center py-10 font-label text-xs uppercase tracking-widest text-outline">No hay resultados en la búsqueda</td></tr>
          </template>
          <template x-for="v in viajesTabla" :key="v.id">
            <tr class="cursor-pointer" @click="abrirDetalle(v)">
              <td class="font-mono text-sm font-bold text-primary" x-text="'#' + String(v.id).padStart(4,'0')"></td>
              <td>
                <div class="text-[10px] font-label uppercase tracking-widest font-bold text-outline-variant mb-1" x-text="v.tipo_movimiento.replace(/_/g,' ')"></div>
                <div class="text-sm font-bold text-on-surface" x-text="v.origen + ' → ' + v.destino"></div>
              </td>
              <td class="text-sm text-on-surface-variant flex items-center gap-2 h-full"><i class="ph-light ph-user text-outline"></i> <span x-text="v.operador || '—'"></span></td>
              <td class="font-mono text-xs text-outline"><div class="flex flex-col"><span x-text="v.economico||'—'"></span><span class="opacity-50" x-text="v.numero_caja||'—'"></span></div></td>
              <td x-html="badgeViaje(v.estatus)"></td>
              <td class="font-mono text-xs" :class="esUrgente(v) ? 'text-danger font-bold' : 'text-outline'" x-text="tiempoEnEstatus(v)"></td>
              <td @click.stop>
                <button @click="abrirAvance(v)" class="px-3 py-1 border border-outline-variant/40 hover:border-primary font-label text-[10px] uppercase font-bold tracking-widest text-outline hover:text-primary transition-colors flex items-center gap-1" x-show="v.estatus !== 'facturado'">Avanzar <i class="ph-bold ph-caret-right"></i></button>
              </td>
            </tr>
          </template>
        </tbody>
      </table>
    </div>

  </main>

  <!-- ── PANEL LATERAL (DRAWER) DE DETALLES ── -->
  <div x-show="showDrawer" class="drawer-overlay" @click="showDrawer=false" x-transition.opacity></div>
  <div class="drawer-panel" :class="{'open': showDrawer}">
    <template x-if="viajeActivo">
      <div class="h-full flex flex-col pt-safe">
        <!-- Header del Drawer -->
        <div class="p-8 border-b border-outline-variant/20 bg-surface-container-low matte-grain">
          <div class="flex justify-between items-start mb-2">
            <div>
              <div class="flex items-center gap-3 mb-2">
                <span class="font-headline text-2xl font-bold text-on-surface">Viaje <span class="text-primary font-mono" x-text="'#'+String(viajeActivo.id).padStart(4,'0')"></span></span>
                <span x-html="badgeViaje(viajeActivo.estatus)"></span>
              </div>
              <div class="text-sm text-on-surface-variant"><i class="ph-light ph-map-pin text-primary"></i> <span x-text="viajeActivo.origen + ' → ' + viajeActivo.destino"></span></div>
            </div>
            <button @click="showDrawer=false" class="text-outline hover:text-primary transition-colors"><i class="ph-bold ph-x text-xl"></i></button>
          </div>
        </div>

        <!-- Cuerpo del Drawer -->
        <div class="flex-1 overflow-auto p-8">
          <div class="flex border-b border-outline-variant/20 mb-8 font-label text-[10px] uppercase tracking-widest font-bold">
            <button class="px-4 py-3 border-b-2 transition-colors" :class="tabActivo === 'resumen' ? 'border-primary text-primary' : 'border-transparent text-outline hover:text-on-surface'" @click="tabActivo = 'resumen'"><i class="ph-light ph-file-text mr-1 text-sm"></i> Resumen</button>
            <button class="px-4 py-3 border-b-2 transition-colors" :class="tabActivo === 'historial' ? 'border-primary text-primary' : 'border-transparent text-outline hover:text-on-surface'" @click="tabActivo = 'historial'"><i class="ph-light ph-git-merge mr-1 text-sm"></i> Pipeline</button>
            <button class="px-4 py-3 border-b-2 transition-colors" :class="tabActivo === 'docs' ? 'border-primary text-primary' : 'border-transparent text-outline hover:text-on-surface'" @click="tabActivo = 'docs'"><i class="ph-light ph-camera mr-1 text-sm"></i> Voucher</button>
          </div>

          <!-- TAB: RESUMEN -->
          <div x-show="tabActivo === 'resumen'">
            <div class="grid grid-cols-2 gap-4">
              <div class="bg-surface-container-high p-4 border border-outline-variant/10"><label class="block font-label text-[10px] uppercase tracking-widest text-outline mb-1 font-bold">Operador</label><span class="text-on-surface text-sm" x-text="viajeActivo.operador || '—'"></span></div>
              <div class="bg-surface-container-high p-4 border border-outline-variant/10"><label class="block font-label text-[10px] uppercase tracking-widest text-outline mb-1 font-bold">Cliente</label><span class="text-on-surface text-sm" x-text="viajeActivo.cliente || '—'"></span></div>
              <div class="bg-surface-container-high p-4 border border-outline-variant/10"><label class="block font-label text-[10px] uppercase tracking-widest text-outline mb-1 font-bold">Tractocamión</label><span class="text-primary font-mono text-sm" x-text="viajeActivo.economico || '—'"></span></div>
              <div class="bg-surface-container-high p-4 border border-outline-variant/10"><label class="block font-label text-[10px] uppercase tracking-widest text-outline mb-1 font-bold">Caja Remolque</label><span class="text-outline font-mono text-sm" x-text="viajeActivo.numero_caja || '—'"></span></div>
              <div class="bg-surface-container-high p-4 border border-outline-variant/10"><label class="block font-label text-[10px] uppercase tracking-widest text-outline mb-1 font-bold">Creado El</label><span class="text-on-surface text-sm" x-text="fmtFecha(viajeActivo.created_at)"></span></div>
              <div class="bg-surface-container-high p-4 border border-outline-variant/10 border-b-2 border-b-primary/50"><label class="block font-label text-[10px] uppercase tracking-widest text-outline mb-1 font-bold">Tiempo Acumulado</label><span class="text-primary font-mono text-sm" x-text="tiempoEnEstatus(viajeActivo)"></span></div>
            </div>
            
            <template x-if="viajeActivo.notas">
              <div class="mt-6 p-5 border-l-2 border-info/50 bg-info/5">
                <label class="block font-label text-[10px] uppercase tracking-widest text-info flex items-center gap-2 font-bold mb-2"><i class="ph-fill ph-info"></i> Notas / Instrucciones</label>
                <div class="text-sm text-on-surface-variant font-body leading-relaxed" x-text="viajeActivo.notas"></div>
              </div>
            </template>
          </div>

          <!-- TAB: HISTORIAL PIPELINE -->
          <div x-show="tabActivo === 'historial'" class="py-4 px-2">
            <div class="relative pl-6 border-l border-outline-variant/30 space-y-8">
              <template x-for="(et, i) in pipeline" :key="et.key">
                <div class="relative">
                  <div class="absolute -left-[31px] top-0 w-4 h-4 rounded-full border-2 bg-surface z-10" :class="estadoIdx(viajeActivo.estatus) > i ? 'bg-success border-success' : (estadoIdx(viajeActivo.estatus) === i ? 'bg-primary border-primary shadow-[0_0_8px_rgba(209,161,78,0.6)]' : 'border-outline-variant')"></div>
                  
                  <div class="font-bold text-sm tracking-wide flex items-center gap-2" :class="estadoIdx(viajeActivo.estatus) === i ? 'text-primary' : (estadoIdx(viajeActivo.estatus) > i ? 'text-success' : 'text-outline')">
                    <i :class="et.icon" class="text-lg"></i> <span x-text="et.label"></span>
                  </div>
                  
                  <div class="text-xs font-label mt-2" :class="estadoIdx(viajeActivo.estatus) === i ? 'text-primary opacity-80' : 'text-outline'" x-show="estadoIdx(viajeActivo.estatus) >= i">
                    <span x-text="estadoIdx(viajeActivo.estatus) === i ? 'Fase Actual · Detenido por ' + tiempoEnEstatus(viajeActivo) : 'Completado con éxito'"></span>
                  </div>
                </div>
              </template>
            </div>
          </div>

          <!-- TAB: DOCUMENTACIÓN -->
          <div x-show="tabActivo === 'docs'" class="py-4">
            <template x-if="viajeActivo.foto_voucher">
              <div class="border border-outline-variant/30 bg-surface-container-high p-2 text-center">
                <a :href="'/cif/api/public/' + viajeActivo.foto_voucher" target="_blank" title="Abrir imagen">
                  <img :src="'/cif/api/public/' + viajeActivo.foto_voucher" class="max-w-full max-h-[400px] mx-auto object-contain" alt="Comprobante">
                </a>
                <div class="font-label text-[10px] uppercase text-outline mt-3 mb-1"><i class="ph-light ph-magnifying-glass-plus"></i> Click para expandir</div>
              </div>
            </template>
            <template x-if="!viajeActivo.foto_voucher">
              <div class="text-center py-20 border border-outline-variant/20 border-dashed bg-surface-container-high text-outline">
                <i class="ph-light ph-camera-slash text-5xl mb-4 opacity-50 block"></i>
                <span class="font-label text-xs uppercase tracking-widest font-bold">Sin evidencia de entrega</span>
              </div>
            </template>
          </div>
        </div>

        <!-- Footer Drawer -->
        <div class="p-6 border-t border-outline-variant/20 bg-surface-container-lowest flex justify-end gap-4 mt-auto">
          <button @click="showDrawer=false" class="px-6 py-3 border border-outline-variant/40 font-label text-xs uppercase tracking-widest font-bold text-outline hover:text-white transition-colors">Colapsar</button>
          <button x-show="viajeActivo.estatus !== 'facturado'" @click="showDrawer=false; abrirAvance(viajeActivo)" class="bg-primary text-on-primary font-label text-xs font-bold uppercase tracking-widest px-8 py-3 hover:brightness-110 transition-all flex items-center gap-2">
            Avanzar <i class="ph-bold ph-caret-right"></i>
          </button>
        </div>
      </div>
    </template>
  </div>

  <!-- ── MODAL DE AVANCE DE ESTATUS CONTEXTUAL ── -->
  <div x-show="showAvance" class="drawer-overlay" style="z-index:999" @click.self="showAvance=false" x-transition.opacity>
    <div class="modal-box" x-show="viajeAvance">
      <div class="text-center mb-6">
        <i class="ph-light ph-git-merge text-5xl text-primary mb-2 block"></i>
        <h3 class="font-headline text-2xl font-bold">Cambio de Fase</h3>
        <span class="font-label text-[10px] uppercase tracking-[0.2em] text-outline mt-1 font-mono">Viaje #<span x-text="String(viajeAvance?.id||0).padStart(4,'0')"></span></span>
      </div>

      <div class="flex items-center justify-center gap-4 py-4 mb-6 bg-surface-container-highest border border-outline-variant/20">
        <span x-html="badgeViaje(viajeAvance?.estatus)"></span>
        <i class="ph-bold ph-arrow-right text-outline"></i>
        <span x-html="badgeViaje(sigEstatus(viajeAvance?.estatus))"></span>
      </div>

      <form @submit.prevent="confirmarAvance">
        <template x-if="sigEstatus(viajeAvance?.estatus) === 'entregado'">
          <div>
            <div class="p-4 mb-6 border font-label text-xs font-bold bg-error/10 border-error/50 text-error flex gap-3" x-show="!viajeAvance?.foto_voucher">
              <i class="ph-fill ph-warning-circle text-xl"></i>
              <div><span class="block mb-1 text-[10px] uppercase tracking-widest opacity-70">Regla R2</span>El operador NO ha reportado la fotografía del voucher. No se puede avanzar si no existe evidencia visual.</div>
            </div>
            <div class="p-4 mb-6 border font-label text-xs font-bold bg-success/10 border-success/50 text-success flex items-center gap-3" x-show="viajeAvance?.foto_voucher">
              <i class="ph-fill ph-check-circle text-xl"></i>
              Voucher validado. Transición autorizada.
            </div>
          </div>
        </template>
        
        <template x-if="sigEstatus(viajeAvance?.estatus) === 'documentado'">
          <div class="mb-6">
            <label class="block font-label text-[10px] uppercase tracking-widest text-outline font-bold mb-2">Folio de Boleta / Carta Porte</label>
            <input type="text" x-model="formAvance.folio_boleta" class="w-full bg-surface border border-outline-variant/40 text-on-surface py-3 px-4 font-mono font-bold focus:border-primary focus:outline-none transition-colors" required placeholder="Ej: FAC-8930">
          </div>
        </template>

        <div class="grid grid-cols-2 gap-4">
          <button type="button" @click="showAvance=false" class="border border-outline-variant/40 font-label text-xs font-bold uppercase tracking-widest py-3 text-outline hover:text-white transition-colors">Cancelar</button>
          <button type="submit" class="bg-primary text-on-primary font-label text-xs font-bold uppercase tracking-widest py-3 flex items-center justify-center gap-2 disabled:opacity-50 disabled:cursor-not-allowed" :disabled="guardando || (sigEstatus(viajeAvance?.estatus) === 'entregado' && !viajeAvance?.foto_voucher)">
            <span x-show="!guardando" class="flex items-center gap-2">Confirmar <i class="ph-bold ph-check"></i></span>
            <span x-show="guardando" class="spinner border-on-primary" style="border-top-color:transparent"></span>
          </button>
        </div>
      </form>
    </div>
  </div>

  <!-- ── MODAL: NUEVO VIAJE ── -->
  <div x-show="showNuevo" class="drawer-overlay" @click.self="showNuevo = false" x-transition.opacity>
    <div class="modal-box" style="max-width:700px">
      <div class="flex justify-between items-start mb-6">
        <div>
          <i class="ph-light ph-plus-circle text-primary text-3xl mb-2"></i>
          <h3 class="font-headline text-2xl font-bold">Despachar Viaje</h3>
        </div>
        <button @click="showNuevo = false" class="text-outline hover:text-white transition-colors"><i class="ph-bold ph-x text-xl"></i></button>
      </div>
      
      <form @submit.prevent="crearViaje">
         <div class="grid grid-cols-1 md:grid-cols-2 gap-5 mb-8">
          <div>
            <label class="block font-label text-[10px] uppercase tracking-widest text-outline font-bold mb-2">Transacción Operativa</label>
            <select x-model="form.tipo_movimiento" class="w-full bg-surface border border-outline-variant/40 text-on-surface p-3 font-label text-sm focus:border-primary focus:outline-none" required>
              <option value="local_cargado">Local Cargado</option><option value="local_vacio">Local Vacío</option><option value="recoleccion">Recolección</option><option value="interplanta">Interplanta</option><option value="exportacion">Exportación</option><option value="importacion">Importación</option>
            </select>
          </div>
          <div>
            <label class="block font-label text-[10px] uppercase tracking-widest text-outline font-bold mb-2">Entidad / Cliente</label>
            <select x-model="form.cliente_id" @change="const map = { '1': 'Planta Licom', '2': 'Planta DANGIL', '3': 'Planta Biopapel', '4': 'Planta Sumitomo' }; if(map[form.cliente_id]) form.destino = map[form.cliente_id];" class="w-full bg-surface border border-outline-variant/40 text-on-surface p-3 font-label text-sm focus:border-primary focus:outline-none">
              <option value="">No aplica</option>
              <template x-for="c in catalogos.clientes">
                <option :value="c.id" x-text="c.razon_social"></option>
              </template>
            </select>
          </div>
          <div>
            <label class="block font-label text-[10px] uppercase tracking-widest text-outline font-bold mb-2">Origen de Operación</label>
            <select x-model="form.origen" class="w-full bg-surface border border-outline-variant/40 text-on-surface p-3 font-label text-sm focus:border-primary focus:outline-none" required>
              <option value="">Selecciona origen...</option>
              <template x-for="d in catalogos.destinos">
                <option :value="d.nombre" x-text="d.nombre"></option>
              </template>
            </select>
          </div>
          <div>
            <label class="block font-label text-[10px] uppercase tracking-widest text-outline font-bold mb-2">Destino Objetivo</label>
            <select x-model="form.destino" class="w-full bg-surface border border-outline-variant/40 text-on-surface p-3 font-label text-sm focus:border-primary focus:outline-none" required>
              <option value="">Selecciona destino...</option>
              <template x-for="d in catalogos.destinos">
                <option :value="d.nombre" x-text="d.nombre"></option>
              </template>
            </select>
          </div>
          <div class="md:col-span-2 border-t border-outline-variant/20 pt-4 mt-2"></div>
          <div>
            <label class="block font-label text-[10px] uppercase tracking-widest text-outline font-bold mb-2"><i class="ph-light ph-user pr-1"></i> Asignar Operador</label>
            <select x-model="form.operador_id" class="w-full bg-surface border border-outline-variant/40 text-on-surface p-3 font-label text-sm focus:border-primary focus:outline-none" required><option value="">Seleccionar en catálogo...</option><template x-for="o in catalogos.operadores"><option :value="o.id" x-text="o.nombre_completo"></option></template></select>
          </div>
          <div>
            <label class="block font-label text-[10px] uppercase tracking-widest text-outline font-bold mb-2"><i class="ph-light ph-truck pr-1"></i> Asignar Tracto</label>
            <select x-model="form.tractocamion_id" class="w-full bg-surface border border-outline-variant/40 text-primary font-mono font-bold p-3 focus:border-primary focus:outline-none" required><option value="">Vincular unidad...</option><template x-for="t in catalogos.tractos_disponibles"><option :value="t.id" x-text="t.numero_economico"></option></template></select>
          </div>
        </div>
        
        <div class="flex justify-end gap-4">
          <button type="button" @click="showNuevo = false" class="px-6 py-3 font-label text-xs uppercase tracking-widest font-bold text-outline hover:text-white transition-colors">Abortar</button>
          <button type="submit" class="bg-primary text-on-primary font-label text-xs font-bold uppercase tracking-widest px-8 py-3 flex items-center justify-center gap-2 hover:brightness-110" :disabled="guardando">
            <span x-show="!guardando">Ejecutar Comando</span>
            <span x-show="guardando" class="spinner border-on-primary" style="border-top-color:transparent"></span>
          </button>
        </div>
      </form>
    </div>
  </div>

</div>

<!-- API Script -->
<script src="assets/js/api.js?v=3"></script>
<script>
function viajesApp() {
  return {
    loading: true, guardando: false,
    vista: 'kanban', /* kanban | tabla */
    viajes: [], viajesTabla: [],
    catalogos: { clientes:[], operadores:[], tractos_disponibles:[], cajas_disponibles:[], destinos:[] },
    kpis: { en_ruta: 0, en_aduana: 0, entregados_hoy: 0, por_documentar: 0 },
    busqueda: '',
    usuario: null, puedeCrear: false,
    
    showDrawer: false, viajeActivo: null, tabActivo: 'resumen',
    showAvance: false, viajeAvance: null, formAvance: { folio_boleta: '' },
    showNuevo: false, form: { tipo_movimiento:'local_cargado', cliente_id:'', operador_id:'', tractocamion_id:'', origen:'', destino:'' },

    kanbanCols: [
      { key: 'solicitado', label: 'Pendientes', icon: 'ph-light ph-clipboard-text', items: [] },
      { key: 'asignado',   label: 'Asignados', icon: 'ph-light ph-push-pin', items: [] },
      { key: 'en_transito',label: 'En Tránsito', icon: 'ph-light ph-truck', items: [] },
      { key: 'en_aduana',  label: 'En Aduana / Cruce', icon: 'ph-light ph-buildings', items: [] },
      { key: 'entregado',  label: 'Entregados', icon: 'ph-light ph-check-circle', items: [] },
    ],

    pipeline: [
      { key:'solicitado', label:'Borrador Solicitado', icon:'ph-light ph-clipboard-text' },
      { key:'asignado', label:'Unidad Asignada', icon:'ph-light ph-push-pin' },
      { key:'en_transito', label:'Tránsito Físico', icon:'ph-light ph-truck' },
      { key:'en_aduana', label:'Cruce de Aduana', icon:'ph-light ph-buildings' },
      { key:'entregado', label:'Confirmación Visual', icon:'ph-light ph-camera' },
      { key:'documentado', label:'Auditoría de Folios', icon:'ph-light ph-file-text' },
      { key:'facturado', label:'Corte Contable', icon:'ph-light ph-currency-dollar' },
    ],

    async init() {
      this.usuario = cifAPI.getCurrentUser() || await cifAPI.me();
      if(this.usuario) this.puedeCrear = ['admin','trafico'].includes(this.usuario.rol);
      await this.cargarDatos();
      setInterval(() => { if(this.vista==='kanban') this.organizarKanban(); }, 60000); // refresh temporizadores
    },

    async cargarDatos() {
      this.loading = true;
      const res = await cifAPI.get('/viajes');
      if (res?.viajes) {
        this.viajes = res.viajes;
        this.actualizarKPIs();
        this.organizarKanban();
        this.filtrarTabla();
      }
      if (this.puedeCrear && this.catalogos.operadores.length === 0) {
        const cat = await cifAPI.get('/viajes/catalogos');
        if (cat) this.catalogos = { ...this.catalogos, ...cat };
        
        const dests = await cifAPI.get('/destinos_catalogos');
        if (dests && dests.destinos) {
          this.catalogos.destinos = dests.destinos;
        } else {
          this.catalogos.destinos = [];
        }
      }
      this.loading = false;
    },

    actualizarKPIs() {
      const hoyStr = new Date().toISOString().slice(0,10);
      let enRuta = 0, enAduana = 0, entHoy = 0, pDoc = 0;
      
      this.viajes.forEach(v => {
        if(v.estatus === 'en_transito') enRuta++;
        if(v.estatus === 'en_aduana') enAduana++;
        if(v.estatus === 'entregado') pDoc++;
        if(v.estatus === 'entregado' || v.estatus === 'documentado') {
          const base = v.updated_at || v.created_at;
          if(base && base.startsWith(hoyStr)) entHoy++;
        }
      });
      this.kpis = { en_ruta: enRuta, en_aduana: enAduana, entregados_hoy: entHoy, por_documentar: pDoc };
    },

    organizarKanban() {
      // Limpiar
      this.kanbanCols.forEach(col => col.items = []);
      // Distribuir (solo activos, excluye documentado/facturado)
      this.viajes.forEach(v => {
        const col = this.kanbanCols.find(c => c.key === v.estatus);
        if (col) col.items.push(v);
      });
    },

    filtrarTabla() {
      const q = this.busqueda.toLowerCase();
      this.viajesTabla = this.viajes.filter(v => 
        !q || v.operador?.toLowerCase().includes(q) || v.origen?.toLowerCase().includes(q) || v.destino?.toLowerCase().includes(q) || String(v.id).includes(q)
      );
    },

    abrirDetalle(v) {
      this.viajeActivo = v;
      this.tabActivo = 'resumen';
      this.showDrawer = true;
    },
    abrirAvance(v) {
      this.viajeAvance = v;
      this.formAvance = { folio_boleta: v.folio_boleta || '' };
      this.showAvance = true;
    },
    abrirNuevo() {
      this.form = { tipo_movimiento:'local_cargado', cliente_id:'', operador_id:'', tractocamion_id:'', origen:'', destino:'' };
      this.showNuevo = true;
    },

    async confirmarAvance() {
      const sig = this.sigEstatus(this.viajeAvance.estatus);
      if (!sig) return;
      
      const p = { estatus: sig };
      if(sig === 'documentado') p.folio_boleta = this.formAvance.folio_boleta;

      this.guardando = true;
      const res = await cifAPI.put(`/viajes/${this.viajeAvance.id}/estatus`, p);
      this.guardando = false;
      this.showAvance = false;
      if (res?.ok) {
        cifToast('Protocolo de cambio de fase ejecutado correctamente');
        if(this.viajeActivo?.id === this.viajeAvance.id) this.viajeActivo.estatus = sig;
        
        // --- SINCRONIZACIÓN FLOTA (1 FUENTE DE VERDAD) ---
        // Sincroniza Tractos y Cajas en Flota según la fase del viaje
        if (sig === 'en_transito' || sig === 'en_aduana') {
           if (this.viajeAvance.tractocamion_id) {
             await cifAPI.put(`/tractocamiones/${this.viajeAvance.tractocamion_id}`, { estatus: 'en_ruta', ubicacion_actual: 'EN RUTA' });
           }
           if (this.viajeAvance.caja_id) {
             const cr = await cifAPI.get('/cajas');
             const caja = cr?.data?.find(c => c.id == this.viajeAvance.caja_id || c.numero_caja === this.viajeAvance.caja_id);
             if (caja) await cifAPI.put(`/cajas/${caja.id}`, { estatus: 'en_viaje', ubicacion_actual: 'EN RUTA', cliente_nombre: this.viajeAvance.destino || '' });
           }
        } else if (sig === 'entregado') {
           if (this.viajeAvance.tractocamion_id) {
             await cifAPI.put(`/tractocamiones/${this.viajeAvance.tractocamion_id}`, { estatus: 'disponible', ubicacion_actual: 'CLIENTE' });
           }
           if (this.viajeAvance.caja_id) {
             const cr = await cifAPI.get('/cajas');
             const caja = cr?.data?.find(c => c.id == this.viajeAvance.caja_id || c.numero_caja === this.viajeAvance.caja_id);
             if (caja) await cifAPI.put(`/cajas/${caja.id}`, { estatus: 'en_cliente', ubicacion_actual: 'CLIENTE', cliente_nombre: this.viajeAvance.destino || '' });
           }
        }
        // --------------------------------------------------

        await this.cargarDatos();
      } else { cifToast(res?.error || 'Falló la conexión al núcleo logístico', 'error'); }
    },

    async crearViaje() {
      this.guardando = true;
      const res = await cifAPI.post('/viajes', this.form);
      this.guardando = false;
      if (res?.ok) { cifToast('Orden de despacho completada con éxito'); this.showNuevo = false; await this.cargarDatos(); } 
      else { cifToast(res?.error || 'Error de despacho', 'error'); }
    },

    // UX format helpers
    tiempoEnEstatus(v) {
      const base = v.updated_at || v.created_at;
      if (!base) return '0m';
      const t = new Date(base.replace(' ', 'T')); 
      const now = new Date();
      const mins = Math.max(0, Math.floor((now - t) / 60000));
      if (mins < 60) return `${mins}m`;
      const hrs = Math.floor(mins / 60);
      if (hrs < 24) return `${hrs}h ${mins%60}m`;
      return `${Math.floor(hrs/24)}d ${hrs%24}h`;
    },
    esUrgente(v) {
      const base = v.updated_at || v.created_at;
      if(!base) return false;
      const t = new Date(base.replace(' ', 'T'));
      const hrs = (new Date() - t) / 3600000;
      if (v.estatus==='en_transito' && hrs>4) return true; // >4h en tránsito = alerta
      if (v.estatus==='en_aduana' && hrs>2) return true;
      if (v.estatus==='asignado' && hrs>2) return true;
      return false;
    },
    sigEstatus(e) {
      const m = { solicitado:'asignado', asignado:'en_transito', en_transito:'en_aduana', en_aduana:'entregado', entregado:'documentado', documentado:'facturado' };
      return m[e] || null;
    },
    estadoIdx(e) { return this.pipeline.findIndex(p => p.key === e); },
    
    badgeViaje(estatus) { 
      if(typeof badgeViaje === 'function') return badgeViaje(estatus); 
      const map = {
        'asignado': 'bg-info/20 text-info border border-info/30',
        'en_ruta': 'bg-success/20 text-success border border-success/30',
        'en_aduana': 'bg-warning/20 text-warning border border-warning/30',
        'en_transito': 'bg-alert/20 text-alert border border-alert/30',
        'entregado': 'bg-surface-container-highest text-outline border border-outline/30 text-on-surface-variant',
        'facturado': 'bg-surface-container-low text-outline border border-outline-variant/30 text-on-surface-variant opacity-70',
        'incidencia': 'bg-danger/20 text-danger border border-danger/30',
      };
      const clz = map[estatus?.toLowerCase()] || 'bg-outline-variant/20 text-outline border-outline/30';
      return `<span class="inline-flex items-center px-3 py-1 text-[10px] font-label uppercase tracking-widest font-bold ${clz}">${(estatus||'N/A').replace(/_/g,' ')}</span>`;
    },
    fmtFecha(d) { 
      if(typeof fmtFecha === 'function') return fmtFecha(d);
      if(!d) return '—';
      return new Date(d.replace(' ', 'T')).toLocaleString('es-MX', {dateStyle:'short', timeStyle:'short'});
    }
  };
}
</script>
</body>
